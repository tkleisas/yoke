name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4 # pinned: the version Yoke is developed and tested against

      - name: Type-check
        run: deno task check

      - name: Run tests
        run: deno task test

