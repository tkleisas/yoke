name: Release

# Builds installable binaries for Windows, Linux, and macOS and attaches them
# to a GitHub Release. Triggered by version tags: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4 # pinned: the version Yoke is developed and tested against
      - name: Type-check
        run: deno task check
      - name: Run tests
        run: deno task test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: yoke
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: yoke.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: yoke
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4 # pinned: the version Yoke is developed and tested against

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compile binary
        run: deno compile --target ${{ matrix.target }} --output ${{ matrix.binary }} --allow-net --allow-env --allow-read --allow-write --allow-run main.ts

      - name: Package archive
        shell: bash
        run: |
          tar -czf yoke-${{ steps.version.outputs.tag }}-${{ matrix.os }}.tar.gz ${{ matrix.binary }}
          sha256sum yoke-${{ steps.version.outputs.tag }}-${{ matrix.os }}.tar.gz > yoke-${{ steps.version.outputs.tag }}-${{ matrix.os }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yoke-${{ matrix.os }}
          path: yoke-${{ steps.version.outputs.tag }}-${{ matrix.os }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          awk -v v="$VERSION" '/^## \[/ { if (found) exit; if ($0 ~ "^## \\[" v "\\]") found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "No changelog entry found for v$VERSION." > release_notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Yoke v${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: dist/yoke-*
          fail_on_unmatched_files: false

